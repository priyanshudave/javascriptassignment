<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Assignment 3 DOM</title>

  <link rel="stylesheet" href="stylle.css">
</head>

<body>

  <div class="container">

    <div class="top-header">
      Assignment 3 (JS)
    </div>

    <h1 class="main-heading">
      Assignment 3: DOM Implementation
    </h1>

    <div class="greeting" id="greetingText">
      Hello
    </div>

    <div class="box-container">

      <div class="box red" onclick="changeColor(this,'red')">
        Red
      </div>

      <div class="box blue" onclick="changeColor(this,'blue')">
        Blue
      </div>

      <div class="box green" onclick="changeColor(this,'green')">
        Green
      </div>

      <div class="box yellow" onclick="changeColor(this,'yellow')">
        Yellow
      </div>

    </div>

    <div class="input-section">

      <input 
        type="text" 
        id="nameInput" 
        placeholder="Enter your name"
      />

      <button onclick="greetUser()">
        Greet
      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
